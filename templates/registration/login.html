{% extends 'base.html' %}

{% block title %}Log in — Atelier{% endblock %}

{% block content %}
    <div class="page-head">
        <p class="eyebrow">Back again</p>
        <h1>Log in</h1>
    </div>

    <form class="form-shell" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Log in</button>
            <a class="link-quiet" href="{% url 'signup' %}">Need an account?</a>
        </div>
    </form>
{% endblock %}
