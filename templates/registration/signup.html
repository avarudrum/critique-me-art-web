{% extends 'base.html' %}

{% block title %}Sign up — Atelier{% endblock %}

{% block content %}
    <div class="page-head">
        <p class="eyebrow">Join</p>
        <h1>Create an account</h1>
        <p class="lede">Hang your own work, ask a real question about it, and answer other people's.</p>
    </div>

    <form class="form-shell" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Create account</button>
            <a class="link-quiet" href="{% url 'login' %}">Already have one?</a>
        </div>
    </form>
{% endblock %}
