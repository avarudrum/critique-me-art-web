{% extends 'base.html' %}

{% block title %}Edit {{ artwork.title }} — Atelier{% endblock %}

{% block content %}
    <div class="page-head">
        <p class="eyebrow">Editing</p>
        <h1>{{ artwork.title }}</h1>
    </div>

    <div class="composer-layout">
        <div>
            <div class="artwork-plate">
                <img src="{{ artwork.image.url }}" alt="{{ artwork.title }}">
            </div>
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% include 'artworks/_medium_suggestions.html' %}

            <div class="actions">
                <button type="submit">Save changes</button>
                <a class="link-quiet" href="{% url 'artwork_detail' artwork.pk %}">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
