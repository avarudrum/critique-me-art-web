{% extends 'base.html' %}

{% block title %}Edit profile — Atelier{% endblock %}

{% block content %}
    <div class="page-head">
        <h1>Edit profile</h1>
        <p class="lede lede-accent">Connect with like-minded artists.</p>
    </div>

    <form class="form-shell" method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="actions">
            <button type="submit">Save profile</button>
            <a class="link-quiet" href="{% url 'profile' user.username %}">Cancel</a>
        </div>
    </form>
{% endblock %}
